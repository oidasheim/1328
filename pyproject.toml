[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oidasheim-synapse"
version = "0.2.0"
description = "Modular SYNAPSE production, rhythm, and semantic video workflow"
readme = "SYNAPSE-MODULE.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
semantic = ["duckdb>=1.0", "open-clip-torch>=2.24", "torch>=2.2", "Pillow>=10", "opencv-python>=4.8", "numpy>=1.26", "librosa>=0.10"]
test = ["pytest>=8"]

[project.scripts]
synapse-plan = "synapse_cli:main"
synapse-index-clips = "synapse.index_clips:main"
synapse-semantic-render = "synapse.semantic_render:main"

[tool.setuptools]
packages = ["synapse"]
py-modules = ["synapse_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
