[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oidasheim-synapse"
version = "0.8.0"
description = "Local-first SYNAPSE workflow, compiler, orchestration and ethical feedback analytics"
readme = "SYNAPSE-MODULE.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
semantic = ["duckdb>=1.0", "open-clip-torch>=2.24", "torch>=2.2", "Pillow>=10", "opencv-python>=4.8", "numpy>=1.26", "librosa>=0.10"]
audio = ["librosa>=0.10", "numpy>=1.26", "soundfile>=0.12"]
vision = ["opencv-python>=4.8", "numpy>=1.26"]
cuda = ["numpy>=1.26", "opencv-python>=4.8", "cupy-cuda12x>=13"]
test = ["pytest>=8", "numpy>=1.26"]

[project.scripts]
synapse-plan = "synapse_cli:main"
synapse-index-clips = "synapse.index_clips:main"
synapse-semantic-render = "synapse.semantic_render:main"
synapse-wong = "synapse.wong_cli:main"
synapse-fullstack = "synapse.fullstack:main"
synapse-feedback = "synapse.feedback_cli:main"
synapse-art-director = "synapse.art_director:main"
weedit-art-director = "weedit_native.art_director:main"
weedit-lipsync = "weedit_native.lipsync_cli:main"
weed = "weedit_native.cli:main"

[tool.setuptools]
packages = ["synapse", "weedit_native"]
py-modules = ["synapse_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
